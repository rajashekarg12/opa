# Target REST connector base URLs applied after .expx import (before activate).
# Format: connector.{connectorId}.baseUrl=https://target-host/...
#
# REST connectors only. The base URL here is written to the connector and is what OPA
# calls at run time.
#
# Integration (OIC) connectors are not listed here and are not migrated by this plugin.
# OPA ignores their stored base URL and calls whichever Oracle Integration instance is
# set as the Registered Service in the target workspace, using only the integration flow
# path from the connector.


# Connector CheckApprovalRestService (REST)
connector.71dfa6ed-06e4-415d-b248-a8c90a0d8da0.baseUrl=${{MY_URL}}

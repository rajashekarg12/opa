# Target REST connector base URLs applied after .expx import (before activate).
# Format: {applicationName}|{version}.connector.{connectorId}.baseUrl=https://...
#
# Version is everything between '|' and '.connector.' (may contain dots).
# Application name must not contain '|'. Same connector id can appear under many
# app|version keys when clones share an id but need different target URLs.
# On deploy, FlexDeploy applies only entries matching the imported app|version.
#
# REST connectors only. Integration (OIC) connectors are not listed; OPA uses the
# workspace Registered Service for those.



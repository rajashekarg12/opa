# Add target environment values for global credentials from Workspace.
# Format: {mapName}.{keyName}.{property}=value
# PASSWORD (Basic): set password.
# OAUTH: set secret (client secret or full base64 OAuth blob).
# OCI_SIGNATURE_POLICY: set privateKey, and privateKeyPassPhrase if the key has one.
#   Keep privateKey on one line, use a FlexDeploy encrypted property rather than a pasted
#   multi-line PEM, because this file is read one line at a time.
# Secret values are intentionally blank on export, fill them before deploy, empty OAUTH secret
# or OCI_SIGNATURE_POLICY privateKey fails.
# Delete any credential blocks you do not want to manage at deploy time.



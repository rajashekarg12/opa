# role-members-info.properties — snapshot of Workspace role members at build time.
#
# Import (.expx) copies design roles and members from source to target.
# Activate publishes those roles into Workspace (runtime).
# FlexDeploy only has runtime (data-access) APIs for members. Changing Workspace
# members does NOT change design-time membership inside the Process Application.
#
# This file is informational metadata captured beside the export (APPLICATION roles
# for this app, plus Global roles). Source app must be activated.
#
# Empty properties are omitted. Role UUIDs are not written (env-specific).

